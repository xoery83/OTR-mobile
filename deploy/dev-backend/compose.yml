services:
  backend:
    container_name: otr-dev-backend
    build:
      context: ../..
      dockerfile: deploy/dev-backend/Dockerfile
    env_file:
      - ../../../env/backend.env
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
