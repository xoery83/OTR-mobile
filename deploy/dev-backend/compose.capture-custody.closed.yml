# Explicit C2-only override. Requires attested pre-existing sources; never base-only.
services:
  backend:
    command: ["node", "server-capture.mjs"]
    cap_drop: [ALL]
    volumes:
      - type: bind
        source: /opt/otr/dev-backend/private/capture-custody
        target: /var/lib/otr/capture-custody
        bind:
          create_host_path: false
      - type: bind
        source: /opt/otr/dev-backend/env/capture-custody.json
        target: /run/otr/capture-custody.json
        read_only: true
        bind:
          create_host_path: false
